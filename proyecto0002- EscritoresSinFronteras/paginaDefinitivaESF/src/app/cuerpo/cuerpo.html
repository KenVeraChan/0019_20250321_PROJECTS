<div class="fondoCuerpoSuperior" [class.fondoSinVentanas]="mostrarPaginaError()">
    @if (!mostrarPaginaError()) {
    <div class="ventanaMensaje">{{mensajeVentana1}}</div>
    <div class="ventanaMensaje">{{mensajeVentana2}}</div>
    }

    @if (mostrarPaginaError()) {
        <div class="areaPaginaError">
            <app-paginaerror></app-paginaerror>
        </div>
    } @else {
    @switch(puntero)
    {
        @case (0)
        {
            <div class="areaNoticias">
                    <app-inicio></app-inicio>
            </div>
        }
        @case (1)
        {
            <div class="areaHistoria">
                    <app-historia></app-historia>
            </div>
        }
        @case (2)
        {
            <div class="areaNosotros">
                    <app-nosotros></app-nosotros>
            </div>
        }
        @case (3)
        {
            <div class="areaBlogs">
                <app-blogs></app-blogs>
            </div>
        }
        @case (4)
        {
            <div class="areaServicios">
                <app-servicios></app-servicios>
            </div>
        }
        @case (5)
        {
            <div class="areaPublicaciones">
                <app-publicaciones></app-publicaciones>
            </div>
        }
        @case (6)
        {
            <div class="areaContacto">
                <app-contacto></app-contacto>
            </div>
        }
    }
    }
</div>
